# The four arms plus the D12 anchor ablation.
#
# Milestone D4–D7 and D12. Every arm inherits `base_v2_2.yaml`; only the
# algorithm block below differs, so a difference in results is attributable.
#
#   E0  vanilla GRPO                      (baseline, veRL default path)
#   E1  GRPO + Dynamic Filtering
#   E2  GRPO + Tau-GiGPO
#   E3  GRPO + Dynamic Filtering + Tau-GiGPO
#
# E0 uses veRL's stock GRPO path with Dynamic Filtering disabled. E2 also leaves
# Dynamic Filtering disabled, but deliberately uses the custom Tau-GiGPO
# estimator; only the filtering patch is a no-op for E2.

defaults:
  inherit: base_v2_2.yaml

arms:
  e0:
    description: vanilla GRPO baseline
    adv_estimator: grpo
    dynamic_filter:
      enable: false
    anchors:
      mode: structured    # encoded for telemetry only; unused by grpo

  e1:
    description: GRPO + fixed-rollout Dynamic Filtering
    adv_estimator: grpo
    dynamic_filter:
      enable: true
      mode: fixed_rollout
      group_size: 8

  e2:
    description: GRPO + Tau-GiGPO (no filtering)
    adv_estimator: tau_gigpo
    dynamic_filter:
      enable: false
    gigpo:
      omega: 1.0
      gamma: 0.95
      fnorm: 1.0
      min_anchor_group_size: 2
    anchors:
      mode: structured

  e3:
    description: GRPO + Dynamic Filtering + Tau-GiGPO
    adv_estimator: tau_gigpo
    dynamic_filter:
      enable: true
      mode: fixed_rollout
      group_size: 8
    gigpo:
      omega: 1.0
      gamma: 0.95
      fnorm: 1.0
      min_anchor_group_size: 2
    anchors:
      mode: structured

ablations:
  # D12: does the structured anchor beat a bare DB hash?
  e2_db_hash_only:
    description: E2 with db_hash_only anchors
    base_arm: e2
    anchors:
      mode: db_hash_only

  e2_similarity:
    description: E2 with similarity-0.9 anchors
    base_arm: e2
    anchors:
      mode: similarity
      similarity_threshold: 0.9
