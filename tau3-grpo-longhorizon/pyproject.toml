[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tau3-grpo-longhorizon"
version = "0.1.0"
description = "AReaL tau2-style training and tau3 official evaluation on veRL"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["huggingface-hub>=0.27", "pandas>=2.2", "pyarrow>=16"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.9"]
stats = ["scipy>=1.12", "pandas>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "tau3: requires Python 3.12 and the sibling tau2-bench install",
  "verl: requires the sibling veRL install",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
