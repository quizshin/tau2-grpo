[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tau3-grpo-longhorizon"
version = "0.1.0"
description = "AReaL tau2-style training and tau3 official evaluation on veRL"
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
data = ["huggingface-hub>=0.27", "pandas>=2.2", "pyarrow>=16"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.9"]
stats = ["scipy>=1.12", "pandas>=2.2"]
sft = [
  "accelerate>=1.2,<2",
  "peft>=0.14,<1",
  "transformers>=4.48,<5",
]

[project.scripts]
tau3-prepare-data = "tau3_grpo.cli.prepare_data:main"
tau3-prepare-experiment = "tau3_grpo.cli.prepare_experiment:main"
tau3-build-parquet = "tau3_grpo.cli.build_parquet:main"
tau3-evaluate = "tau3_grpo.cli.evaluate:main"
tau3-freeze-winner = "tau3_grpo.cli.freeze_winner:main"
tau3-report = "tau3_grpo.cli.report:main"
tau3-verify-patches = "tau3_grpo.cli.verify_patches:main"
tau3-generate-tool-config = "tau3_grpo.cli.generate_tool_config:main"
tau3-train = "tau3_grpo.cli.train:main"
tau3-prepare-sft = "tau3_grpo.cli.prepare_sft:main"
tau3-sft-train = "tau3_grpo.cli.sft_train:main"
tau3-merge-sft = "tau3_grpo.cli.merge_sft:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "tau3: requires Python 3.12 and the sibling tau2-bench install",
  "verl: requires the sibling veRL install",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
