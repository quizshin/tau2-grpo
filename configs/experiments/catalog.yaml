# Active entry points and evidence status. Status does not imply future GPU permission.
schema: tau3_experiment_catalog_v1
sampling_defaults:
  version: sampling_t07_v1
  agreed_on: '2026-09-20'
  policy_train_temperature: 0.7
  policy_eval_temperature: 0.7
  user_train_temperature: 0.7
  user_eval_temperature: 0.7
  gpu_validation: pending_for_changed_sampling
  historical_results: retain_recorded_parameters
formal:
  runner: tau3_grpo.training.rl.runner
  base_profile: configs/train/rl/formal50_a800.yaml
  estimators: [grpo, tau_gigpo, mt_gtpo]
  dynamic_filter: [false, true]
  reward_profiles:
    reference_write_v2: configs/train/rl/formal50_mt_gtpo_v2.yaml
    reference_write_v3: configs/train/rl/formal50_mt_gtpo_v3.yaml
    paper_v1: configs/train/rl/formal50_mt_gtpo_paper_v1.yaml
    paper_env_v2: configs/train/rl/formal50_mt_gtpo_paper_env_v2.yaml
    paper_env_split_v3: configs/train/rl/formal50_mt_gtpo_paper_env_split_v3.yaml
    paper_env_split_v4: configs/train/rl/formal50_mt_gtpo_paper_env_split_v4.yaml
  validation: engineering_acceptance_passed
  gpu_evidence: docs/architecture/interface_acceptance_20260919.md
  validation_scope: bounded_qwen35_4b_dense_text_tp1_no_lora_mt_reference_write_v3
  formal_effects_and_candidate_profiles: require_separate_validation
  gpu_gigpo_followup: docs/architecture/gigpo_acceptance_20260919.md
  paper_requires: passed_frozen_recipe_and_matching_training_manifest
  facts_schema: tau3_trajectory_facts_v1
evaluation:
  entry: tau3_grpo.evaluation.run
  controller: tau3_grpo.evaluation.controller
  comparison: tau3_grpo.evaluation.compare
  selection_protocol: tau3_eval_legacy_v1
  selection_conditions:
    policy_temperature: 0.7
    user_temperature: 0.7
    max_steps: 30
    max_errors: 10
    stop_priority: completed_stop_before_budget_v1
    request_max_tokens: null
    policy_max_model_len: 24576
    user_max_model_len: 16384
    generation_config: vllm
    thinking: false
    trials: 4
    seed: 42
    max_concurrency_per_model: 4
  trajectory_error_policy: preserve_observed_state_continue_other_trials_no_replacement
  selection_status: cpu_revision_gpu_not_started
  selection_evidence: docs/grpo_improvement_evidence_20260920.md
  final_policy: after_model_and_protocol_selection_only
historical:
  dated_profiles: configs/train/rl/*202609*.yaml
  queue: env_info/a800_20260912/run_matched50.py
  purpose: exact_reproduction_and_old_run_resume_inputs
  removal: retain_until_all_compatibility_and_evidence_references_are_resolved
  reference_audit: docs/architecture/cleanup_20260919.md
candidates:
  token_harness_v4:
    purpose: optional_matched_training_diagnostic_not_mandatory_evaluation
    enabled_by_default: false
    status: cpu_verified
    evidence: docs/architecture/token_harness_20260920.md
    training_profile: configs/train/rl/formal50_token_v4.yaml
    evaluation_protocol: tau3_eval_token_v4
    token_protocol: tau3_token_budget_v1
    scope: fresh_areal_selection_text_qwen35_complete_schema
    gpu_validation: pending
  full_tool_schema_v2:
    status: cpu_validated_no_gpu_training
    enabled_by_default: false
    profile: configs/train/rl/formal50_full_schema_v2.yaml
    evidence: docs/architecture/harness_inputs_20260920.md
  eval_train_inputs_v3:
    status: cpu_validated_known_multiturn_token_differences
    enabled_by_default: false
    protocol: tau3_eval_train_inputs_v3
    evidence: docs/architecture/harness_inputs_20260920.md
  structured_v1:
    status: historical_online_evidence
    enabled_by_default: true
    evidence: docs/training_signal_audit_20260914.md
  semantic_state_v4:
    status: development_only_no_online_benefit_claim
    enabled_by_default: false
