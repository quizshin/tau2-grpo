# Supported publication entry points; GPU status is algorithm-specific.
schema: tau3_a800_catalog_v1
hardware: 2xa800
sft:
  curriculum: [A109, B393, C500]
  status: frozen_cpu_verified_gpu_not_started
  package: data/sft/curriculum_500_dev150_portable_codex_20261001/manifest.json
  package_identity: docs/sft500_dev150_portable_package_manifest_20261001.json
  profiles:
    A109: configs/train/sft/curriculum_codex_A109_portable_dev_1epoch.yaml
    B393: configs/train/sft/curriculum_codex_B393_portable_dev_1epoch.yaml
    C500: configs/train/sft/curriculum_codex_C500_portable_dev_1epoch.yaml
  entrypoint: scripts/train/sft/run.sh
  # 新课程RL默认使用C500最后一个merged checkpoint；后续根据同一课程评测挑选表现较好的merged checkpoint。
  checkpoint_selection: pending_gpu_training
rl:
  grpo:
    profile: configs/train/rl/repair72_grpo_2xa800_shared32_full_eval.yaml
    status: historical_repair72_gpu_verified
  arpo:
    profile: configs/train/rl/repair72_arpo_2xa800_shared32.yaml
    status: cpu_verified_gpu_pending
  mt_gtpo:
    profile: configs/train/rl/mt_gtpo_2xa800.yaml
    optional: true
    status: composition_only_gpu_pending
    reward_recipe_required: true
