# Compatibility defaults for direct run_qwen35.sh and engineering profiles.
# Formal profiles override these explicitly; this is not the formal protocol.
launch:
  environment:
    POLICY_GPUS: '1'
    ROLLOUT_TP: '1'
    GROUP_SIZE: '4'
    GROUPS_PER_UPDATE: '2'
    PPO_MINI_GROUPS: '2'
    TOTAL_UPDATES: '3'
    MAX_NUM_SEQS: '4'
    MAX_PROMPT_LENGTH: '8192'
    MAX_RESPONSE_LENGTH: '16384'
    MAX_MODEL_LENGTH: '24576'
transfer_bucket_megabytes:
  default: '2560'
  9B: '4096'
# Applied by the compatibility wrapper BEFORE profile/CLI overrides.
wrapper_overrides:
  - +actor_rollout_ref.model.override_config.attn_implementation=sdpa
  - actor_rollout_ref.model.use_remove_padding=false
  - actor_rollout_ref.model.use_fused_kernels=false
  - actor_rollout_ref.actor.freeze_vision_tower=true
  - actor_rollout_ref.actor.ulysses_sequence_parallel_size=1
  - actor_rollout_ref.actor.fsdp_config.ulysses_sequence_parallel_size=1
  - actor_rollout_ref.actor.fsdp_config.use_orig_params=true
  - actor_rollout_ref.actor.fsdp_config.model_dtype=float32
  - actor_rollout_ref.actor.use_torch_compile=false
  - actor_rollout_ref.ref.fsdp_config.model_dtype=bfloat16
  - actor_rollout_ref.ref.fsdp_config.use_orig_params=true
  - actor_rollout_ref.rollout.multi_turn.format=qwen3_coder
  - actor_rollout_ref.rollout.load_format=safetensors
  - actor_rollout_ref.rollout.enforce_eager=true
  - actor_rollout_ref.rollout.enable_prefix_caching=false
  - actor_rollout_ref.rollout.gpu_memory_utilization=0.30
  - actor_rollout_ref.rollout.agent.num_workers=2
  - +actor_rollout_ref.rollout.engine_kwargs.vllm.language_model_only=true
  - +data.apply_chat_template_kwargs.enable_thinking=false
  - trainer.use_legacy_worker_impl=enable
  - trainer.save_freq=1
