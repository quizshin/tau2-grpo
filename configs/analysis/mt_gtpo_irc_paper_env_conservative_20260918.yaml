# Conservative environment-adapted IRC profile.
# Gold is an explicit reference anchor; ambiguous residual soft/duplicate calls
# are neutral until a separately labeled dataset can identify their direction.
fixed_anchor_policy: gold_reference_v1
alpha: 1.0
delta: 0.05
eta: 0.1
min_support: 20
holdout_fraction: 0.2
split_seed: 42
alignment_tolerance: 1.0e-8
intended_signs:
  state_change: -1
  error: -1
fixed_weights:
  gold_exact: 1.0
  soft_match: 0.0
  read_only: 0.0
  duplicate: 0.0
  message: 0.0
  unknown: 0.0
