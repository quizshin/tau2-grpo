# Current formal component; historical profiles stay available for replay.
launch:
  environment:
    RESULTS_DIR: ${TAU3_RUN_ROOT}/formal50/unassigned
    TOOL_CONFIG: ${RESULTS_DIR}/tool_config.yaml
    GROUP_SIZE: '8'
    GROUPS_PER_UPDATE: '8'
    PPO_MINI_GROUPS: '4'
    TOTAL_UPDATES: '20'
    MAX_PROMPT_LENGTH: '8192'
    MAX_RESPONSE_LENGTH: '16384'
    MAX_MODEL_LENGTH: '24576'
    MAX_TOKENS_PER_TURN: '1024'
    MAX_USER_TURNS: '15'
    MAX_ASSISTANT_TURNS: '15'
    MAX_TOOL_RESPONSE_CHARS: '65536'
    LR: 1e-6
    KL_COEF: '0.01'
    TRAIN_TEMP: '1.0'
    SWANLAB_EXPERIMENT_NAME: formal50-unassigned
    SWANLAB_LOG_DIR: ${RESULTS_DIR}/swanlog
    TAU3_GRPO_DEBUG_BATCH_DIR: ${RESULTS_DIR}/update-batches
    PYTHONUNBUFFERED: '1'
    HF_HUB_OFFLINE: '1'
    TRANSFORMERS_OFFLINE: '1'
    TAU3_GRPO_ANCHOR_VERSION: v1
    VERL_QWEN35_WEIGHT_AUDIT_DIR: ${RESULTS_DIR}/weight-audits
  overrides:
  - trainer.resume_mode=disable
  - trainer.save_freq=10
  - trainer.max_actor_ckpt_to_keep=1
  - algorithm.rollout_correction.bypass_mode=false
  - actor_rollout_ref.actor.checkpoint.save_contents=[model,optimizer,extra]
  - trainer.test_freq=10
  - trainer.val_before_train=false
  - trainer.validation_data_dir=${RESULTS_DIR}/validation
  - actor_rollout_ref.rollout.val_kwargs.n=4
  - actor_rollout_ref.rollout.val_kwargs.do_sample=true
  - actor_rollout_ref.rollout.val_kwargs.temperature=0.4
  - actor_rollout_ref.rollout.val_kwargs.top_p=1.0
  - actor_rollout_ref.rollout.val_kwargs.top_k=-1
  - data.validation_shuffle=false
