# Clean runtime-tool-complete 100-dialogue cold start.
model:
  name_or_path: Qwen/Qwen3.5-4B
  trust_remote_code: false
  attn_implementation: sdpa

data:
  train_jsonl: data/sft/clean14_v1_100/clean14_v1_train.jsonl
  validation_jsonl: data/sft/clean14_v1_100/clean14_v1_validation.jsonl
  tool_config: configs/envs/tool_config.yaml
  expected_train_size: 100
  expected_validation_size: 5
  max_length: 24576

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: qwen35_language_linear

train:
  method: lora
  evaluate_before_train: true
  load_best_model_at_end: true
  num_epochs: 1
  max_steps: -1
  expected_optimizer_steps: 13
  expected_effective_batch_size: 8
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  save_strategy: epoch
  eval_strategy: epoch
  seed: 42

output:
  dir: /root/autodl-fs/tau3-core/code/results/runs/sft_clean14_v1_100/adapter

includes:
- ../../hardware/2x5090.yaml
launch:
  stage: sft
  entrypoint: scripts/train/sft/run_base.sh
  environment:
    TAU3_TRACKING_BACKEND: none
    SFT_MODEL_NAME_OR_PATH: ${TAU3_MODEL_ROOT}/Qwen3.5-4B
