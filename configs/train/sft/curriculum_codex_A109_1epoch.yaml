# Planned cumulative SFT; CPU guard requires the fully frozen package.
model:
  name_or_path: Qwen/Qwen3.5-4B
  trust_remote_code: false
  attn_implementation: sdpa
data:
  train_jsonl: data/sft/curriculum_500_dev150_codex_20260930/train_A109.jsonl
  validation_jsonl: data/sft/curriculum_500_dev150_codex_20260930/validation.jsonl
  tool_config: configs/envs/tool_config.yaml
  expected_train_size: 109
  expected_validation_size: 150
  max_length: 24576
  require_approved_targets: true
  enable_thinking: false
  supervise_reasoning: false
  preserve_historical_reasoning: false
  reviewed_package_manifest: data/sft/curriculum_500_dev150_codex_20260930/manifest.json
  frozen_prompt_protocols:
    c0e0f60839a5d0c5c2cf76f6625cc84ce89392a3fcab93ad1696a1a317d3d9e3: airline_sequential_multicall_v1
    35e8e6f2cedeca6363aeeb414d028d5fb8f799ff7ee59e1884084504def8b052: airline_teacher_visible_text_multicall_v2
    f181cc80ea52016f2607a296abf9183b6388c72107e1577ba568e79e92c0e739: airline_teacher_visible_text_multicall_v2
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: qwen35_language_linear
train:
  method: lora
  evaluate_before_train: true
  load_best_model_at_end: false
  num_epochs: 1
  max_steps: -1
  expected_optimizer_steps: 14
  expected_effective_batch_size: 8
  per_device_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-05
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  save_strategy: epoch
  eval_strategy: epoch
  seed: 42
output:
  dir: results/runs/sft_curriculum_A109_codex_20260930/seed42/adapter
includes:
- ../../hardware/2xa800.yaml
launch:
  stage: sft
  entrypoint: scripts/train/sft/run_base.sh
  environment:
    TAU3_TRACKING_BACKEND: none
    SFT_MODEL_NAME_OR_PATH: ${TAU3_MODEL_ROOT}/Qwen3.5-4B
