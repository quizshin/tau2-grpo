# RL-006: retry RL-004 with actor state offload; all task/token budgets unchanged.
includes:
- qwen35_full_rl004.yaml
launch:
  environment:
    RESULTS_DIR: ${TAU3_RUN_ROOT}/rl006_full_offload_20260909/e0_seed42
    SWANLAB_LOG_DIR: ${TAU3_RUN_ROOT}/rl006_full_offload_20260909/e0_seed42/swanlog
    SWANLAB_EXPERIMENT_NAME: rl-validation-E0-Qwen3.5-0.8B-full-offload-obs64k-g2x4-u3-s42
    TAU3_GRPO_DEBUG_BATCH_DIR: ${TAU3_RUN_ROOT}/rl006_full_offload_20260909/update-batches
  overrides:
  - actor_rollout_ref.actor.fsdp_config.param_offload=true
  - actor_rollout_ref.actor.fsdp_config.optimizer_offload=true
