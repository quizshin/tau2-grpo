# New LoRA RL baseline; never substitutes for historical full-parameter results.
includes:
- ../../protocols/formal50.yaml
- ../../models/qwen35_4b_repair72_lora_rl.yaml
- ../../hardware/2xa800_lora.yaml
- ../../data/train50_selection60.yaml
- ../../simulator/qwen38_27b_awq_client.yaml
launch:
