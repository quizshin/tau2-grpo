includes:
- ../../hardware/2xa800.yaml
- ../../tracking/swanlab.yaml
launch:
  stage: rl
  entrypoint: scripts/train/rl/run_base.sh
  seed: 42
  environment:
    MODEL_PATH: ${TAU3_RUN_ROOT}/sft_airline_merged_seed42
    GROUP_SIZE: '4'
    GROUPS_PER_UPDATE: '2'
    PPO_MINI_GROUPS: '2'
    TOTAL_UPDATES: '3'
    MAX_NUM_SEQS: '4'
    RESULTS_DIR: ${TAU3_RUN_ROOT}/rl_qwen25_lora
  overrides:
  - actor_rollout_ref.model.lora_rank=16
  - actor_rollout_ref.model.lora_alpha=32
  - trainer.resume_mode=disable
  - trainer.max_actor_ckpt_to_keep=2
