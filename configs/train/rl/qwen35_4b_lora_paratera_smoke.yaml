# Infrastructure diagnostic from the base model; not an SFT-initialized experiment.
includes:
- qwen35_lora.yaml
- ../../hardware/2x5090.yaml
launch:
  environment:
    QWEN35_SIZE: 4B
    MODEL_PATH: ${TAU3_MODEL_ROOT}/Qwen3.5-4B
    RESULTS_DIR: ${TAU3_RUN_ROOT}/paratera_4b_lora_base_smoke/e0_seed42
    TOOL_CONFIG: ${RESULTS_DIR}/tool_config.yaml
    GROUP_SIZE: '4'
    GROUPS_PER_UPDATE: '2'
    PPO_MINI_GROUPS: '2'
    TOTAL_UPDATES: '1'
    MAX_NUM_SEQS: '2'
    TAU3_USER_MODEL: ${TAU3_MODEL_ROOT}/Qwen3.8-27B-AWQ-INT4
    TAU3_USER_SERVED_MODEL_NAME: Qwen/Qwen3.8-27B-AWQ-INT4
    TAU3_USER_THINKING: 'off'
    TRAINER_LOGGERS: '[console]'
    TAU3_TRACKING_BACKEND: none
    VERL_QWEN35_LOSS_ONLY_LOGITS: '1'
    VERL_QWEN35_HEAD_CHUNK_SIZE: '128'
    VERL_QWEN35_WEIGHT_AUDIT_DIR: ${TAU3_RUN_ROOT}/paratera_4b_lora_base_smoke/weight-audits
    TAU3_GRPO_DEBUG_BATCH_DIR: ${TAU3_RUN_ROOT}/paratera_4b_lora_base_smoke/update-batches
    OMP_NUM_THREADS: '4'
    OPENBLAS_NUM_THREADS: '4'
    PYTHONUNBUFFERED: '1'
    HF_HUB_OFFLINE: '1'
    TRANSFORMERS_OFFLINE: '1'
    PYTORCH_ALLOC_CONF: 'expandable_segments:True'
  overrides:
  - actor_rollout_ref.actor.fsdp_config.param_offload=true
  - actor_rollout_ref.actor.fsdp_config.optimizer_offload=true
  - actor_rollout_ref.rollout.gpu_memory_utilization=0.40
  - actor_rollout_ref.rollout.agent.num_workers=2
  - trainer.default_local_dir=${TAU3_ARTIFACT_ROOT}/rl_4b_lora_base_smoke
  - trainer.max_actor_ckpt_to_keep=1
