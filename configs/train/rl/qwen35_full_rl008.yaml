# RL-008: resume the last complete RL-007 checkpoint; save checkpoints on persistent storage.
includes:
- qwen35_full_rl007.yaml
launch:
  environment:
    RESULTS_DIR: ${TAU3_RUN_ROOT}/rl008_full_resume_20260909/e0_seed42
    SWANLAB_LOG_DIR: ${TAU3_RUN_ROOT}/rl008_full_resume_20260909/e0_seed42/swanlog
    SWANLAB_EXPERIMENT_NAME: rl-validation-E0-Qwen3.5-0.8B-full-resume1-persistent-obs64k-g2x4-u3-s42
    TAU3_GRPO_DEBUG_BATCH_DIR: ${TAU3_RUN_ROOT}/rl008_full_resume_20260909/update-batches
  overrides:
  - trainer.resume_mode=resume_path
  - trainer.resume_from_path=/root/autodl-fs/tau3_grpo_fix/results/rl007_full_chunklogp_20260909/e0_seed42/global_step_1
  - trainer.default_local_dir=/root/autodl-fs/tau3_grpo_fix/results/rl008_full_resume_20260909/checkpoints
  - trainer.del_local_ckpt_after_load=false
