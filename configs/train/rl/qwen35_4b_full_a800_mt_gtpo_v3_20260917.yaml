# Separate experiment: ungated, execution-equivalent reference DB writes.
includes:
- qwen35_4b_full_a800_c50_matched6h_common_20260912.yaml
- mt_gtpo_base.yaml
launch:
  environment:
    RESULTS_DIR: ${CODE_ROOT}/results/runs/mt_gtpo_reference_write_v3/formal_s42
    TOTAL_UPDATES: '20'
    TAU3_GRPO_DEBUG_BATCH_DIR: ${RESULTS_DIR}/update-batches
    TRAINER_LOGGERS: '[console,swanlab]'
    SWANLAB_MODE: online
    SWANLAB_EXPERIMENT_NAME: MT-GTPO-Qwen35-4B-full-c50-g8x8-u20-refwrite-v3-df-off-s42
  overrides:
  - ++algorithm.process_reward.mode=reference_write
  - ++algorithm.process_reward.version=v3
  - algorithm.dynamic_filter.enable=false
