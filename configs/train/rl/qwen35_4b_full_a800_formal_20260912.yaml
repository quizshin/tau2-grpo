# Formal E0: full language-parameter RL from the new non-thinking SFT model.
# Launch through env_info/a800_20260912/run_full_formal.py after activate.sh.
# The controller explicitly sets this environment, overriding activation defaults.
launch:
  stage: rl
  entrypoint: scripts/train/rl/run_qwen35.sh
  seed: 42
  environment:
    QWEN35_SIZE: 4B
    MODEL_PATH: ${TAU3_ROOT}/checkpoints/sft-merged/new-off
    RESULTS_DIR: ${TAU3_RUN_ROOT}/rl-formal-full-20260912/formal
    TOOL_CONFIG: ${RESULTS_DIR}/tool_config.yaml
    TAU3_POLICY_CUDA_DEVICES: '0,1,2,3'
    POLICY_GPUS: '4'
    ROLLOUT_TP: '1'
    GROUP_SIZE: '8'
    GROUPS_PER_UPDATE: '16'
    PPO_MINI_GROUPS: '4'
    TOTAL_UPDATES: '40'
    MAX_NUM_SEQS: '4'
    MAX_PROMPT_LENGTH: '8192'
    MAX_RESPONSE_LENGTH: '16384'
    MAX_MODEL_LENGTH: '24576'
    MAX_TOKENS_PER_TURN: '1024'
    MAX_USER_TURNS: '15'
    MAX_ASSISTANT_TURNS: '15'
    MAX_TOOL_RESPONSE_CHARS: '65536'
    LR: '1e-6'
    KL_COEF: '0.01'
    TRAIN_TEMP: '1.0'
    TAU3_USER_MODEL: ${TAU3_MODEL_ROOT}/Qwen3.8-27B-AWQ-INT4
    TAU3_USER_SERVED_MODEL_NAME: Qwen/Qwen3.8-27B-AWQ-INT4
    TAU3_USER_BASE_URL: http://127.0.0.1:8100/v1
    TAU3_USER_THINKING: 'off'
    SWANLAB_EXPERIMENT_NAME: formal-E0-Qwen35-4B-full-newSFT-off-g16x8-u40-s42
    SWANLAB_LOG_DIR: ${RESULTS_DIR}/swanlog
    TAU3_GRPO_DEBUG_BATCH_DIR: ${RESULTS_DIR}/update-batches
    OMP_NUM_THREADS: '4'
    OPENBLAS_NUM_THREADS: '4'
    PYTHONUNBUFFERED: '1'
    HF_HUB_OFFLINE: '1'
    TRANSFORMERS_OFFLINE: '1'
    PYTORCH_ALLOC_CONF: 'expandable_segments:True'
  overrides:
  - actor_rollout_ref.model.lora_rank=0
  - actor_rollout_ref.actor.fsdp_config.model_dtype=float32
  - actor_rollout_ref.actor.fsdp_config.param_offload=true
  - actor_rollout_ref.actor.fsdp_config.optimizer_offload=true
  - actor_rollout_ref.ref.fsdp_config.param_offload=true
  - actor_rollout_ref.rollout.gpu_memory_utilization=0.30
  - actor_rollout_ref.rollout.agent.num_workers=4
  - trainer.resume_mode=disable
  - trainer.save_freq=5
  - trainer.max_actor_ckpt_to_keep=1
