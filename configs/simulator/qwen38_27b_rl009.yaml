# Frozen simulator, GPU1 only; dedicated Transformers 5.8 overlay.
launch:
  stage: simulator
  entrypoint: scripts/serve/simulator_qwen38.sh
  environment:
    TAU3_SIM_PYTHON: /root/autodl-fs/tau3_grpo_fix/runtime/venvs/qwen38-sim/bin/python
    TAU3_USER_MODEL: /root/autodl-fs/tau3_grpo_fix/model_store/Qwen3.8-27B-AWQ-INT4
    TAU3_USER_SERVED_MODEL_NAME: Qwen/Qwen3.8-27B-AWQ-INT4
    TAU3_USER_CUDA_DEVICES: '1'
    TAU3_USER_MAX_NUM_SEQS: '8'
    TAU3_USER_MAX_MODEL_LEN: '16384'
    TAU3_USER_GPU_MEMORY_UTILIZATION: '0.65'
    TAU3_USER_THINKING: 'off'
