name: CPU checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./tau2-bench"
          python -m pip install -e ".[dev]"

      - name: Use recorded lint version
        run: python -m pip install ruff==0.16.6

      - name: Reject new lint debt
        run: python scripts/maintenance/check_lint.py

      - name: Validate shell syntax
        run: |
          bash -n setup.sh
          find scripts -type f -name "*.sh" -print0 |
            xargs -0 -n1 bash -n

      - name: Verify pinned vendor runtime inventory
        run: python -m tau3_grpo.integrations.vendor_inventory

      - name: Run core CPU contracts
        run: python scripts/maintenance/check_cpu.py --suite core --junitxml=core-cpu.xml

      - name: Preserve CPU test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-cpu
          path: core-cpu.xml

      # The benchmark and veRL suites run in the existing pinned remote environment:
      # python scripts/maintenance/check_cpu.py --suite benchmark|verl
      # GPU update/synchronization/resume acceptance is separately authorized.
