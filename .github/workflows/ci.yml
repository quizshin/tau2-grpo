name: CPU checks

on:
  pull_request:
  push:
    branches:
      - master
      - dev

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./tau2-bench"
          python -m pip install -e ".[dev]"

      - name: Lint project-owned Python
        run: |
          ruff check tau3_grpo tests

      - name: Validate shell syntax
        run: |
          bash -n setup.sh
          find scripts -type f -name "*.sh" -print0 |
            xargs -0 -n1 bash -n

      - name: Run deterministic CPU unit tests
        run: |
          pytest -q \
            tests/test_anchors.py \
            tests/test_dynamic_filtering.py \
            tests/test_tau_gigpo.py \
            tests/test_metrics.py \
            tests/test_eval_scoring.py \
            tests/test_eval_runtime.py \
            tests/test_eval_cli.py \
            tests/test_service_attestation.py \
            tests/test_configs.py \
            tests/test_multicall_prompt.py \
            tests/test_experiment_manifest.py \
            tests/test_leakage_audit.py \
            tests/test_path_traversal.py \
            tests/test_patch_contract.py
